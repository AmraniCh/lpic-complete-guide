site_name: LPIC Complete Guide
site_description: >-
  Open study notes for LPIC certifications. Plain English, real command
  output, real config samples.
site_url: https://lpic.amranich.dev/
repo_url: https://github.com/AmraniCh/lpic-complete-guide
repo_name: lpic-complete-guide
edit_uri: edit/main/docs/
copyright: Released under the MIT licence.

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar-resize.js

hooks:
  - tools/hooks.py

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  # Material renders these next to the page name in the sidebar, so readers
  # can see at a glance which objectives still need writing.
  status:
    written: Written
    stub: Not written yet

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AmraniCh/lpic-complete-guide
      name: This project on GitHub

