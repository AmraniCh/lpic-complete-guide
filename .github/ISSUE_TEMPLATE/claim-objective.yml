name: Claim an objective to write
description: Take ownership of an unwritten page so nobody duplicates your work
title: "[Writing] "
labels: ["help wanted", "claimed"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Writing a page is the best way to learn an objective
        properly, and it helps everyone who comes after you.

        Before you start, please read the
        [style guide](https://github.com/AmraniCh/lpic-complete-guide/blob/main/docs/style-guide.md).
        It is short, and it is what keeps the pages consistent.

  - type: input
    id: objective
    attributes:
      label: Which objective?
      placeholder: "103.7 Search text files using regular expressions"
    validations:
      required: true

  - type: dropdown
    id: when
    attributes:
      label: Roughly when do you expect to open a pull request?
      description: No pressure. This just tells us when to free the page again if life gets busy.
      options:
        - "Within a week"
        - "Within two weeks"
        - "Within a month"
        - "Not sure yet"
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you start
      options:
        - label: I have read the style guide
          required: true
        - label: I will write in my own words, not paste from copyrighted material
          required: true
